<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="EVTN — Trouvez et partagez les bornes de recharge pour véhicules électriques en Tunisie. Carte interactive, puissance, disponibilité en temps réel." />
    <meta name="theme-color" content="#10B981" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>EVTN — Bornes de Recharge Tunisie</title>
  </head>
  <body>
    <script>
      window.onerror = function(msg, url, line, col, error) {
        alert("CRASH: " + msg + "\nLine: " + line);
        return false;
      };
      window.addEventListener('unhandledrejection', function(event) {
        alert("PROMISE REJECTION: " + event.reason);
      });
    </script>
    <div id="root"></div>
    <script>
      // Cache bust v2 — force clear old PWA caches
      (function() {
        var CACHE_VERSION = 'v2-20260817';
        if (localStorage.getItem('evtn_cache_version') !== CACHE_VERSION) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              registrations.forEach(function(r) { r.unregister(); });
            });
          }
          if ('caches' in window) {
            caches.keys().then(function(names) {
              names.forEach(function(name) { caches.delete(name); });
            });
          }
          localStorage.setItem('evtn_cache_version', CACHE_VERSION);
          if (performance.navigation && performance.navigation.type !== 1) {
            location.reload();
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
